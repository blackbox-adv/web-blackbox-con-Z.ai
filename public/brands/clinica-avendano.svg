    <circle cx="0" cy="-14" r="2.8" fill="#10B981" />
    <circle cx="9.9" cy="-9.9" r="2.8" fill="#0D9488" />
    <circle cx="14" cy="0" r="2.8" fill="#0284C7" />
    <circle cx="9.9" cy="9.9" r="2.8" fill="#06B6D4" />
    <circle cx="0" cy="14" r="2.8" fill="#14B8A6" />
    <circle cx="-9.9" cy="9.9" r="2.8" fill="#10B981" />
    <circle cx="-14" cy="0" r="2.8" fill="#0D9488" />
    <circle cx="-9.9" cy="-9.9" r="2.8" fill="#0284C7" />
    <!-- Inner subtle ring -->
