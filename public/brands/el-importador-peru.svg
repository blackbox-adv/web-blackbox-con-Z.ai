<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 50" fill="none">
  <!-- Circular container / crane logo -->
  <g transform="translate(10, 5)">
    <circle cx="20" cy="20" r="19" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1" />
    <!-- Crane hook and cables -->
    <path d="M20 5V12M15 15L20 12L25 15" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round" />
    <path d="M19 12C19 14 21 14 21 12" stroke="#1F2937" stroke-width="1.5" />
    <!-- Cargo package with Peru/China color division -->
    <rect x="11" y="17" width="18" height="13" rx="1.5" fill="#DC2626" />
    <rect x="16.5" y="17" width="7" height="13" fill="#FFFFFF" />
    <!-- Mini star / accent -->
    <circle cx="26" cy="19" r="1.2" fill="#FBBF24" />
  </g>
  
  <!-- Text Block -->
  <text x="60" y="23" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#111827" letter-spacing="0.5">EL IMPORTADOR</text>
  <text x="60" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#DC2626" letter-spacing="3">PERÚ DIRECTO</text>
</svg>
