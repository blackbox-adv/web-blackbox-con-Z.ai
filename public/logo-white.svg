<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Isometric Hexagonal Cube Outline with Letter B inside (White on Dark) -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Hexagon / Cube Perimeter -->
    <polygon points="120,8 168,36 168,92 120,120 72,92 72,36" fill="#09090b" />
    
    <!-- Y-Division Lines (Isometric Cube Edges) -->
    <line x1="120" y1="64" x2="120" y2="120" />
    <line x1="120" y1="64" x2="72" y2="36" />
    <line x1="120" y1="64" x2="168" y2="36" />
  </g>

  <!-- Letter 'B' inside the top face / center -->
  <g fill="#ffffff">
    <path d="M 112 36 L 123 36 C 127 36 129.5 37.8 129.5 41 C 129.5 43.2 128 44.8 125.5 45.6 C 128.5 46.5 130.5 48.5 130.5 52 C 130.5 56 127 58.5 122.5 58.5 L 112 58.5 Z M 116.5 40.5 L 116.5 45 L 121.5 45 C 123.5 45 125 44 125 42.8 C 125 41.5 123.5 40.5 121.5 40.5 Z M 116.5 49.5 L 116.5 54.5 L 122 54.5 C 124.5 54.5 126 53.3 126 52 C 126 50.7 124.5 49.5 122 49.5 Z" />
  </g>

  <!-- Brand Typography: BLACK BOX -->
  <g fill="#ffffff">
    <text 
      x="120" 
      y="144" 
      font-family="'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif" 
      font-size="22" 
      font-weight="900" 
      letter-spacing="0.12em" 
      text-anchor="middle"
    >
      BLACK BOX
    </text>
    
    <!-- Subtitle: Agencia de marketing -->
    <text 
      x="120" 
      y="162" 
      font-family="'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif" 
      font-size="10.5" 
      font-weight="500" 
      letter-spacing="0.04em" 
      text-anchor="middle"
      fill="#d1d5db"
    >
      Agencia de marketing
    </text>
  </g>
</svg>
